{% extends "market/base.html" %}
{% block title %}Choose a new password · Krishi Bazaar{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5">
  <div class="lux-auth-card">
    <h1 class="h3 fw-bold mb-3">Choose a new password</h1>
    <form method="post">
      {% csrf_token %}
      <label class="lux-form-label">New password</label>
      <input class="lux-input mb-3" type="password" name="password" minlength="6" required autocomplete="new-password">
      <label class="lux-form-label">Confirm new password</label>
      <input class="lux-input mb-3" type="password" name="confirm_password" minlength="6" required autocomplete="new-password">
      <button class="btn btn-gold w-100 py-2 fw-bold">Change password</button>
    </form>
  </div>
</div></div></div>
{% endblock %}
